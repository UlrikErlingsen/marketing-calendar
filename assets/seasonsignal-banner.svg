<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">SeasonSignal — the Norwegian marketing year, worked backwards</title>
  <desc id="desc">Banner with the SeasonSignal mark, the product name and a twelve-month strip of marked moments.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173C3A"/><stop offset=".75" stop-color="#102C2A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <circle cx="1120" cy="-10" r="170" fill="none" stroke="#83D2B4" stroke-opacity=".12" stroke-width="56"/>
  <g transform="translate(64 62) scale(.9)">
    <rect width="96" height="96" rx="24" fill="#1F4A47"/>
    <rect x="18" y="22" width="60" height="54" rx="9" fill="none" stroke="#83D2B4" stroke-width="3" opacity=".6"/>
    <path d="M18 36h60" stroke="#83D2B4" stroke-width="3" opacity=".6"/>
    <path d="M33 16v12M63 16v12" stroke="#F2C66D" stroke-width="4" stroke-linecap="round"/>
    <path d="M22 64c8 0 9-16 17-16s9 12 17 12 8-18 18-18" fill="none" stroke="#F8F5ED" stroke-width="5" stroke-linecap="round"/>
    <circle cx="66" cy="45" r="5" fill="#D95B40"/>
  </g>
  <text x="170" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#FFFFFF" letter-spacing="-2">Season<tspan fill="#F2C66D">Signal</tspan></text>
  <text x="172" y="146" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#D7E3DF">The Norwegian marketing year — moments, plan-back deadlines, calendar export.</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#B9CBC5">
    <line x1="64" y1="222" x2="1136" y2="222" stroke="#83D2B4" stroke-opacity=".35" stroke-width="2"/>
    <text x="64" y="252">JAN</text><text x="153" y="252">FEB</text><text x="242" y="252">MAR</text><text x="331" y="252">APR</text>
    <text x="420" y="252">MAI</text><text x="509" y="252">JUN</text><text x="598" y="252">JUL</text><text x="687" y="252">AUG</text>
    <text x="776" y="252">SEP</text><text x="865" y="252">OKT</text><text x="954" y="252">NOV</text><text x="1043" y="252">DES</text>
  </g>
  <g>
    <rect x="160" y="212" width="40" height="20" rx="10" fill="#83D2B4"/>
    <rect x="300" y="212" width="36" height="20" rx="10" fill="#83D2B4"/>
    <rect x="370" y="212" width="80" height="20" rx="10" fill="#F2C66D"/>
    <circle cx="460" cy="222" r="9" fill="#D95B40"/>
    <rect x="610" y="212" width="60" height="20" rx="10" fill="#83D2B4"/>
    <rect x="700" y="212" width="40" height="20" rx="10" fill="#83D2B4"/>
    <rect x="1010" y="212" width="30" height="20" rx="10" fill="#D95B40"/>
    <rect x="1040" y="212" width="80" height="20" rx="10" fill="#F2C66D" opacity=".8"/>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#F8F5ED">
    <text x="372" y="202">russetid</text><text x="444" y="202">17. mai</text><text x="606" y="202">fellesferie</text>
    <text x="700" y="202">skolestart</text><text x="980" y="202">Black Week</text>
  </g>
</svg>
