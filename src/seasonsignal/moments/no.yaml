# Season Signal moments library — Norway
#
# Every date is a rule (see src/seasonsignal/rules.py); nothing is hard-coded per year.
#
# basis:
#   official    — the date is set by law or by the body that owns it; `source` points there.
#   tradition   — a long-established Norwegian date rule documented by an authoritative reference (SNL).
#   observed    — set locally (e.g. a kommune's skolerute); the rule reproduces the published dates for the
#                 years named in `verified`. Re-check each year.
#   convention  — a commercial or cultural convention with no official owner; `notes` explains why,
#                 `source` points to the best reference description.
#
# A moment has either `date` (one day) or `start` + `end` (an inclusive range).
# `varies` marks moments that are set by kommune/fylke: the national entry is then a RANGE covering the
# common local choices, and `variants` gives verified per-region rules.
# Last full review of rules and URLs: 2026-10-01 (Bergen and Trondheim school rules added the same day).

version: 1
country: NO

regions:
  - id: all
    name: All of Norway
  - id: oslo
    name: Oslo municipality (kommune)
  - id: bergen
    name: Bergen municipality (kommune)
  - id: trondheim
    name: Trondheim municipality (kommune)

categories:
  retail: {nb: Handel, en: Retail}
  food: {nb: Mat og drikke, en: Food & drink}
  fashion: {nb: Mote, en: Fashion}
  travel: {nb: Reise, en: Travel}
  b2b: {nb: B2B, en: B2B}
  alcohol_free: {nb: Alkoholfritt, en: Alcohol-free}
  kids: {nb: Barn og familie, en: Kids & family}

kinds:
  public_holiday: {nb: Helligdag, en: Public holiday}
  retail: {nb: Handelsdag, en: Retail moment}
  season: {nb: Ferie og sesong, en: Season & holidays}
  culture: {nb: Merkedag, en: Cultural moment}

moments:
  # ---------------------------------------------------------------- public holidays (helligdager)
  - id: nyttarsdag
    name: {nb: Nyttårsdag, en: New Year's Day}
    kind: public_holiday
    date: {rule: fixed, month: 1, day: 1}
    tags: [retail, food, b2b]
    basis: official
    source: https://lovdata.no/dokument/NL/lov/1995-02-24-12
    notes: Public holiday (helligdag) under the Public Holidays Act (helligdagsfredloven) § 2. "New year, new me" — health, fitness and budgeting messages.

  - id: skjaertorsdag
    name: {nb: Skjærtorsdag, en: Maundy Thursday}
    kind: public_holiday
    date: {rule: easter, offset: -3}
    tags: [retail, food, travel, alcohol_free]
    basis: official
    source: https://lovdata.no/dokument/NL/lov/1995-02-24-12
    notes: Public holiday (helligdag); Easter Sunday − 3 days. Most shops closed — last grocery run is Wednesday.

  - id: langfredag
    name: {nb: Langfredag, en: Good Friday}
    kind: public_holiday
    date: {rule: easter, offset: -2}
    tags: [food, travel]
    basis: official
    source: https://lovdata.no/dokument/NL/lov/1995-02-24-12
    notes: Public holiday (helligdag); Easter Sunday − 2 days.

  - id: paskedag
    name: {nb: Påskedag, en: Easter Sunday}
    kind: public_holiday
    date: {rule: easter}
    tags: [retail, food, travel, kids, alcohol_free]
    basis: official
    source: https://lovdata.no/dokument/NL/lov/1995-02-24-12
    notes: >-
      Helligdag; Western Easter (first Sunday after the first full moon on or after 21 March, as defined in the
      law). Easter eggs (påskeegg), Easter crime fiction (påskekrim), cabin trips.

  - id: andre_paskedag
    name: {nb: 2. påskedag, en: Easter Monday}
    kind: public_holiday
    date: {rule: easter, offset: 1}
    tags: [travel]
    basis: official
    source: https://lovdata.no/dokument/NL/lov/1995-02-24-12
    notes: Public holiday (helligdag); Easter Sunday + 1 day. Return-traffic day from the cabin.

  - id: forste_mai
    name: {nb: 1. mai — Arbeidernes dag, en: May Day}
    kind: public_holiday
    date: {rule: fixed, month: 5, day: 1}
    tags: [b2b]
    basis: official
    source: https://lovdata.no/dokument/NL/lov/1947-04-26-1
    notes: Official public holiday under the Act on 1 and 17 May as public holidays (lov om 1. og 17. mai som høgtidsdager).

  - id: syttende_mai
    name: {nb: 17. mai — Grunnlovsdagen, en: Constitution Day}
    kind: public_holiday
    date: {rule: fixed, month: 5, day: 17}
    tags: [retail, food, fashion, kids, alcohol_free]
    basis: official
    source: https://lovdata.no/dokument/NL/lov/1947-04-26-1
    notes: >-
      Official public holiday (Act on 1 and 17 May as public holidays, lov om 1. og 17. mai som høgtidsdager). Norway's biggest food, ice-cream, sausage, bunad (national costume) and party-wear moment; also the end of the russ season (russetid).

  - id: kristi_himmelfart
    name: {nb: Kristi himmelfartsdag, en: Ascension Day}
    kind: public_holiday
    date: {rule: easter, offset: 39}
    tags: [travel, retail]
    basis: official
    source: https://lovdata.no/dokument/NL/lov/1995-02-24-12
    notes: Public holiday (helligdag); Easter Sunday + 39 days (always a Thursday). Many take Friday off — a long weekend.

  - id: pinsedag
    name: {nb: Pinsedag, en: Whit Sunday}
    kind: public_holiday
    date: {rule: easter, offset: 49}
    tags: [travel]
    basis: official
    source: https://lovdata.no/dokument/NL/lov/1995-02-24-12
    notes: Public holiday (helligdag); Easter Sunday + 49 days.

  - id: andre_pinsedag
    name: {nb: 2. pinsedag, en: Whit Monday}
    kind: public_holiday
    date: {rule: easter, offset: 50}
    tags: [travel, retail]
    basis: official
    source: https://lovdata.no/dokument/NL/lov/1995-02-24-12
    notes: Public holiday (helligdag); Easter Sunday + 50 days. Long weekend; often the first garden/grill weekend.

  - id: forste_juledag
    name: {nb: 1. juledag, en: Christmas Day}
    kind: public_holiday
    date: {rule: fixed, month: 12, day: 25}
    tags: [food, kids]
    basis: official
    source: https://lovdata.no/dokument/NL/lov/1995-02-24-12
    notes: Public holiday (helligdag) under the Public Holidays Act (helligdagsfredloven) § 2.

  - id: andre_juledag
    name: {nb: 2. juledag, en: Boxing Day}
    kind: public_holiday
    date: {rule: fixed, month: 12, day: 26}
    tags: [food]
    basis: official
    source: https://lovdata.no/dokument/NL/lov/1995-02-24-12
    notes: Public holiday (helligdag) under the Public Holidays Act (helligdagsfredloven) § 2.

  # ---------------------------------------------------------------- cultural moments
  - id: dry_january
    name: {nb: Tørrlagt januar, en: Dry January}
    kind: culture
    start: {rule: fixed, month: 1, day: 1}
    end: {rule: fixed, month: 1, day: 31}
    tags: [alcohol_free, food]
    basis: convention
    source: https://alcoholchange.org.uk/get-involved/campaigns/dry-january
    notes: >-
      International campaign month, widely picked up in Norway. No Norwegian owner. Remember that alcohol
      advertising is banned in Norway (the Alcohol Act, alkoholloven § 9-2); alcohol-free variants need care not to promote
      the parent brand.

  - id: samefolkets_dag
    name: {nb: Samefolkets dag, en: Sámi National Day}
    kind: culture
    date: {rule: fixed, month: 2, day: 6}
    tags: [b2b]
    basis: official
    source: https://no.wikipedia.org/wiki/Samefolkets_dag
    notes: Official flag day since 2003 (6 Feb). Mark respectfully — not a sales moment.

  - id: morsdag
    name: {nb: Morsdag, en: "Mother's Day, Norway"}
    kind: retail
    date: {rule: nth_weekday, month: 2, weekday: sun, n: 2}
    tags: [retail, food, fashion, kids]
    basis: tradition
    source: https://snl.no/morsdag
    notes: >-
      Second Sunday in FEBRUARY in Norway (not May as in the US/most of Europe). Flowers, chocolate,
      breakfast-in-bed. International brands regularly get this wrong.

  - id: fastelavn
    name: {nb: Fastelavnssøndag, en: Shrovetide Sunday}
    kind: culture
    date: {rule: easter, offset: -49}
    tags: [food, kids]
    basis: tradition
    source: https://snl.no/fastelavn
    notes: Easter Sunday − 49 days (falls 1 Feb – 7 Mar). Shrovetide buns (fastelavnsboller) with cream; decorated birch twigs (fastelavnsris).

  - id: valentinsdag
    name: {nb: Valentinsdagen, en: Valentine's Day}
    kind: retail
    date: {rule: fixed, month: 2, day: 14}
    tags: [retail, food, fashion]
    basis: convention
    source: https://snl.no/valentinsdag
    notes: Imported convention; fixed date. Often within days of Mother's Day (morsdag) — plan the two together.

  - id: sankthansaften
    name: {nb: Sankthansaften, en: Midsummer Eve}
    kind: culture
    date: {rule: fixed, month: 6, day: 23}
    tags: [food, alcohol_free]
    basis: tradition
    source: https://snl.no/sankthans
    notes: Bonfires and grilling on 23 June; not a public holiday (SNL).

  - id: halloween
    name: {nb: Halloween, en: Halloween}
    kind: retail
    date: {rule: fixed, month: 10, day: 31}
    tags: [retail, food, kids, fashion]
    basis: convention
    source: https://snl.no/halloween
    notes: Imported convention, now a significant sweets and costume moment. Fixed date.

  - id: farsdag
    name: {nb: Farsdag, en: "Father's Day, Norway"}
    kind: retail
    date: {rule: nth_weekday, month: 11, weekday: sun, n: 2}
    tags: [retail, food, fashion, kids]
    basis: tradition
    source: https://snl.no/farsdag
    notes: Second Sunday in NOVEMBER in Norway (not June as in the US/UK). Lands just before Black Week.

  - id: forste_advent
    name: {nb: 1. søndag i advent, en: First Sunday of Advent}
    kind: culture
    date: {rule: weekday_on_or_after, month: 11, day: 27, weekday: sun}
    tags: [retail, food, kids]
    basis: tradition
    source: https://snl.no/advent
    notes: Four Sundays before Christmas Day; always 27 Nov – 3 Dec. Advent calendars must be in store before.

  - id: julaften
    name: {nb: Julaften, en: Christmas Eve}
    kind: culture
    date: {rule: fixed, month: 12, day: 24}
    tags: [retail, food, kids, alcohol_free]
    basis: convention
    source: https://snl.no/julaften
    notes: >-
      The main Norwegian Christmas celebration (pork rib or cured lamb rib — ribbe or pinnekjøtt — and presents in the evening). Not a public holiday under helligdagsfredloven § 2, but shops close early.

  - id: nyttarsaften
    name: {nb: Nyttårsaften, en: New Year's Eve}
    kind: culture
    date: {rule: fixed, month: 12, day: 31}
    tags: [food, fashion, alcohol_free]
    basis: convention
    source: https://snl.no/nytt%C3%A5rsaften
    notes: Party food, fireworks, party wear. Not a public holiday.

  # ---------------------------------------------------------------- retail moments
  - id: black_friday
    name: {nb: Black Friday, en: Black Friday}
    kind: retail
    date: {rule: nth_weekday, month: 11, weekday: thu, n: 4, offset: 1}
    tags: [retail, fashion, food, b2b]
    basis: convention
    source: https://snl.no/Black_Friday
    notes: >-
      The day after US Thanksgiving (4th Thursday of November + 1). Imported convention; Norway's single
      biggest online-retail day.

  - id: black_week
    name: {nb: Black Week, en: Black Week}
    kind: retail
    start: {rule: relative, to: black_friday, offset: -4}
    end: {rule: relative, to: black_friday, offset: 3}
    tags: [retail, fashion, food, kids]
    basis: convention
    source: https://www.bi.no/forskning/business-review/articles/2021/11/gi-norske-forbrukere-en-gronnere-black-friday/
    notes: >-
      Norwegian retailers stretch Black Friday into a week — commonly Monday of Black Friday week through
      Cyber Monday. Many start earlier ("Black November"); treat the start as the latest safe go-live.

  - id: cyber_monday
    name: {nb: Cyber Monday, en: Cyber Monday}
    kind: retail
    date: {rule: relative, to: black_friday, offset: 3}
    tags: [retail, fashion]
    basis: convention
    source: https://snl.no/Black_Friday
    notes: Monday after Black Friday. Imported convention; online-only offers.

  - id: singles_day
    name: {nb: Singles' Day, en: Singles' Day}
    kind: retail
    date: {rule: fixed, month: 11, day: 11}
    tags: [retail, fashion]
    basis: convention
    source: https://en.wikipedia.org/wiki/Singles%27_Day
    notes: 11.11 — imported from China via e-commerce; fixed date. The opening shot of the November sales.

  - id: julehandel
    name: {nb: Julehandelen, en: Christmas shopping season}
    kind: retail
    start: {rule: relative, to: black_week}
    end: {rule: fixed, month: 12, day: 24}
    tags: [retail, food, fashion, kids, alcohol_free]
    basis: convention
    source: https://www.virke.no/analyse/julehandel/
    notes: >-
      Retail's peak season. Now effectively starts with Black Week and runs to Christmas Eve (julaften); Virke (the Federation of Norwegian Enterprise) reports November + December as the Christmas shopping (julehandel) period.

  - id: julebord
    name: {nb: Julebordsesongen, en: Christmas-party season}
    kind: culture
    start: {rule: nth_weekday, month: 11, weekday: fri, n: 2}
    end: {rule: nth_weekday, month: 12, weekday: sat, n: 3}
    tags: [food, fashion, b2b, alcohol_free]
    basis: convention
    source: https://snl.no/julebord
    notes: >-
      Workplace Christmas parties cluster on Friday/Saturday evenings from mid-November to mid-December.
      No official dates; the range is a planning convention. Venues book up by early autumn.

  - id: romjul
    name: {nb: Romjul / mellomjulssalg, en: Romjul & between-Christmas sales}
    kind: retail
    start: {rule: fixed, month: 12, day: 27}
    end: {rule: fixed, month: 12, day: 30}
    tags: [retail, fashion, travel]
    basis: convention
    source: https://snl.no/romjul
    notes: >-
      Romjul is the days between Christmas and New Year. The between-Christmas sale (mellomjulssalg) starts
      27 Dec; many retailers run it into January.

  - id: feriepenger
    name: {nb: Feriepenger utbetales, en: Holiday pay lands}
    kind: retail
    start: {rule: fixed, month: 6, day: 1}
    end: {rule: fixed, month: 6, day: 30}
    tags: [retail, travel, fashion]
    basis: official
    source: https://lovdata.no/dokument/NL/lov/1988-04-29-21
    notes: >-
      The Holidays Act (ferieloven) § 11: holiday pay is paid on the last regular payday before the holiday — for most
      employees the June salary, when the ordinary tax deduction is also skipped. Payday varies by employer,
      hence the month range.

  # ---------------------------------------------------------------- seasons and school holidays
  - id: vinterferie
    name: {nb: Vinterferie, en: Winter school break}
    kind: season
    start: {rule: iso_week, week: 8, weekday: mon}
    end: {rule: iso_week, week: 9, weekday: fri}
    varies: kommune
    tags: [travel, kids, food, retail]
    basis: observed
    source: https://lovdata.no/dokument/NL/lov/2023-06-09-30
    notes: >-
      One school week in ISO week 8 OR 9, set locally (by the municipality, kommune, for primary and lower-secondary school; by the county, fylkeskommune, for upper-secondary school) under the Education Act (opplæringslova) § 14-1. The national entry spans both weeks — check the local school calendar (skolerute).
    variants:
      - region: oslo
        start: {rule: iso_week, week: 8, weekday: mon}
        end: {rule: iso_week, week: 8, weekday: fri}
        source: https://www.oslo.kommune.no/skole-og-utdanning/ferie-og-fridager/
        verified: 2026/27, 2027/28
      - region: bergen
        start: {rule: iso_week, week: 9, weekday: mon}
        end: {rule: iso_week, week: 9, weekday: fri}
        source: https://www.bergen.kommune.no/omkommunen/avdelinger/etat-for-skole/ferie-og-fridager
        verified: 2026/27, 2027/28 (indicative school calendar, veiledende skolerute)
      - region: trondheim
        start: {rule: iso_week, week: 8, weekday: mon}
        end: {rule: iso_week, week: 8, weekday: fri}
        source: https://www.trondheim.kommune.no/tema/skole/trondheimsskolen/overganger/ferie-og-fridager/
        verified: 2026/27, 2027/28

  - id: paskeferie
    name: {nb: Påskeferie, en: Easter school break}
    kind: season
    start: {rule: easter, offset: -8}
    end: {rule: easter, offset: 2}
    varies: kommune
    tags: [travel, food, kids, retail, alcohol_free]
    basis: observed
    source: https://lovdata.no/dokument/NL/lov/2023-06-09-30
    notes: >-
      Schools close from the Monday before Maundy Thursday through Easter Monday; some municipalities (kommuner) add the Tuesday. Range shown: Saturday before Palm Sunday to Easter Tuesday. Peak cabin and mountain season.
    variants:
      - region: oslo
        start: {rule: easter, offset: -6}
        end: {rule: easter, offset: 2}
        source: https://www.oslo.kommune.no/skole-og-utdanning/ferie-og-fridager/
        verified: 2026/27, 2027/28
      - region: bergen
        start: {rule: easter, offset: -6}
        end: {rule: easter, offset: 1}
        source: https://www.bergen.kommune.no/omkommunen/avdelinger/etat-for-skole/ferie-og-fridager
        verified: 2026/27, 2027/28 (indicative school calendar, veiledende skolerute)
      - region: trondheim
        start: {rule: easter, offset: -6}
        end: {rule: easter, offset: 1}
        source: https://www.trondheim.kommune.no/tema/skole/trondheimsskolen/overganger/ferie-og-fridager/
        verified: 2026/27, 2027/28

  - id: russetid
    name: {nb: Russetiden, en: Russ celebration season}
    kind: season
    start: {rule: fixed, month: 4, day: 20}
    end: {rule: fixed, month: 5, day: 17}
    tags: [fashion, food, retail, alcohol_free]
    basis: convention
    source: https://www.regjeringen.no/no/aktuelt/regjeringen-skal-endre-russetiden/id3030864/
    notes: >-
      Traditionally ~20 April to 17. mai for final-year upper-secondary students (russ). No legal dates.
      The Government aims to move the celebration after exams and from 2026 spreads final-year (vg3) written exams
      either side of 17. mai — expect this window to shift; re-check each year. Marketing to russ involves
      minors: avoid alcohol and pressure tactics.

  - id: skoleslutt
    name: {nb: Skoleslutt, en: Last day of school}
    kind: season
    start: {rule: fixed, month: 6, day: 17}
    end: {rule: fixed, month: 6, day: 24}
    varies: kommune
    tags: [kids, retail, travel, food]
    basis: observed
    source: https://lovdata.no/dokument/NL/lov/2023-06-09-30
    notes: >-
      Set in each municipality's school calendar (skolerute; opplæringslova § 14-1); usually a weekday between ~17 and 24 June.
      Oslo's last day was Fri 18 June 2027 and is Thu 22 June 2028 — no stable weekday rule, so a range.

  - id: fellesferie
    name: {nb: Fellesferie, en: Collective summer holiday}
    kind: season
    start: {rule: iso_week, week: 28, weekday: mon}
    end: {rule: iso_week, week: 30, weekday: fri}
    tags: [travel, food, retail, b2b, alcohol_free]
    basis: convention
    source: https://www.thelocal.no/20210702/fellesferie-everything-you-need-to-know-about-norways-collective-holiday-period
    notes: >-
      Traditionally ISO weeks 28–30 in July, recommended by NHO (the Confederation of Norwegian Enterprise) and Fellesforbundet (the United Federation of Trade Unions) for industry (6–24 July
      in 2026). The Holidays Act (ferieloven) § 5 lets employees claim 3 weeks' main holiday between 1 June and 30 September
      (https://lovdata.no/dokument/NL/lov/1988-04-29-21). B2B goes quiet; travel, grilling and cabin peak.

  - id: skolestart
    name: {nb: Skolestart, en: Back to school}
    kind: season
    start: {rule: iso_week, week: 33, weekday: mon}
    end: {rule: iso_week, week: 34, weekday: fri}
    varies: kommune
    tags: [kids, retail, fashion, food, b2b]
    basis: observed
    source: https://lovdata.no/dokument/NL/lov/2023-06-09-30
    notes: >-
      First school day is set locally, usually mid-August (ISO week 33 or 34) — Bergen even varies the weekday
      (Fri 14 Aug 2026, Mon 16 Aug 2027), so it keeps the national range. Back-to-school is also the autumn restart ("høstoppstart") for B2B: offices fill up again after the collective summer holiday (fellesferie).
    variants:
      - region: oslo
        date: {rule: nth_weekday, month: 8, weekday: mon, n: 3}
        source: https://www.oslo.kommune.no/skole-og-utdanning/ferie-og-fridager/
        verified: 2026/27, 2027/28, 2028/29 (17 Aug 2026, 16 Aug 2027, 21 Aug 2028)
      - region: trondheim
        date: {rule: iso_week, week: 34, weekday: mon}
        source: https://www.trondheim.kommune.no/tema/skole/trondheimsskolen/overganger/ferie-og-fridager/
        verified: 2026/27, 2027/28 (17 Aug 2026, 23 Aug 2027)

  - id: hostferie
    name: {nb: Høstferie, en: Autumn school break}
    kind: season
    start: {rule: iso_week, week: 40, weekday: mon}
    end: {rule: iso_week, week: 41, weekday: fri}
    varies: kommune
    tags: [travel, kids, food]
    basis: observed
    source: https://lovdata.no/dokument/NL/lov/2023-06-09-30
    notes: >-
      One school week in ISO week 40 or 41, set locally (e.g. Oslo and Bærum week 40; Trondheim, Haugesund
      and Nord-Aurdal week 41 in 2026). The national entry spans both weeks.
    variants:
      - region: oslo
        start: {rule: iso_week, week: 40, weekday: mon}
        end: {rule: iso_week, week: 40, weekday: fri}
        source: https://www.oslo.kommune.no/skole-og-utdanning/ferie-og-fridager/
        verified: 2026/27, 2027/28
      - region: bergen
        start: {rule: iso_week, week: 41, weekday: mon}
        end: {rule: iso_week, week: 41, weekday: fri}
        source: https://www.bergen.kommune.no/omkommunen/avdelinger/etat-for-skole/ferie-og-fridager
        verified: 2026/27, 2027/28 (indicative school calendar, veiledende skolerute)
      - region: trondheim
        start: {rule: iso_week, week: 41, weekday: mon}
        end: {rule: iso_week, week: 41, weekday: fri}
        source: https://www.trondheim.kommune.no/tema/skole/trondheimsskolen/overganger/ferie-og-fridager/
        verified: 2026/27, 2027/28

  - id: juleferie
    name: {nb: Juleferie, en: Christmas school break}
    kind: season
    start: {rule: fixed, month: 12, day: 19}
    end: {rule: fixed, month: 1, day: 3, year_offset: 1}
    varies: kommune
    tags: [travel, kids, food, retail]
    basis: observed
    source: https://lovdata.no/dokument/NL/lov/2023-06-09-30
    notes: >-
      Set locally; typically from the weekend before Christmas to the first working days of January
      (Oslo: 21 Dec 2026 – 1 Jan 2027; 20 Dec 2027 – 3 Jan 2028). Shown as ~19 Dec – ~3 Jan.
