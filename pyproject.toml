[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seasonsignal"
version = "1.0.0"
description = "Season Signal: an open Norwegian marketing calendar with plan-back deadlines and calendar export"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [{ name = "Ulrik Erlingsen" }]
keywords = [
  "marketing calendar",
  "campaign planning",
  "Norway",
  "public holidays",
  "icalendar",
  "streamlit",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Natural Language :: Norwegian",
  "Topic :: Office/Business :: Scheduling",
]
dependencies = [
  "icalendar>=5.0,<7",
  "openpyxl>=3.1,<4",
  "pandas>=2.1,<3",
  "python-dateutil>=2.8,<3",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
app = [
  "plotly>=5.18,<8",
  "streamlit>=1.38,<2",
]
test = [
  "build>=1.2,<2",
  "plotly>=5.18,<8",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
  "streamlit>=1.38,<2",
]

[project.urls]
Homepage = "https://github.com/UlrikErlingsen/marketing-calendar"
Source = "https://github.com/UlrikErlingsen/marketing-calendar"
Issues = "https://github.com/UlrikErlingsen/marketing-calendar/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seasonsignal = ["moments/*.yaml"]
"seasonsignal.ui" = ["assets/marks/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
