name: Bug report
description: Something did not work as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Season Signal. Never attach confidential campaign plans, your saved `seasonsignal.json`, credentials, or other sensitive information.
  - type: dropdown
    id: platform
    attributes:
      label: How are you running Season Signal?
      options:
        - Windows launcher
        - macOS launcher
        - Terminal
        - Docker
        - Hosted deployment
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "1.0.0 or a commit SHA"
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the page, year, category and region, the action, the expected result, and the actual result.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Choose ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: safe_sample
    attributes:
      label: Safe sample data or error text
      description: Use invented campaigns and fictional brands only.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed confidential campaign plans, credentials, and other sensitive information.
          required: true
